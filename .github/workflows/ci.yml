name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify
      - run: npm run test:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Linux image
        run: docker build --build-arg RELEASE_ID=${{ github.sha }} -t chilolab-portfolio:ci .
      - name: Deploy to ephemeral runner
        run: PORTFOLIO_IMAGE=chilolab-portfolio:ci docker compose up -d --wait --wait-timeout 60
      - name: Smoke test deployed image
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: npm run test:container
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down
