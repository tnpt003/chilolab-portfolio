locale: vi
pageTitle: Về mình
metaDescription: 'Nguyễn Tấn Phát: BA/QC tại WeebPal từ 08/2025, tốt nghiệp Công nghệ thông tin tại HUFLIT, tự làm và phát hành phần mềm Windows tại ChiloLab. Kinh nghiệm, kỹ năng, hành trình và liên hệ.'
heading: Mình là Phát. Mình làm BA/QC, và thích tự làm những phần mềm nhỏ.
lead: 'Mình học Công nghệ thông tin ở HUFLIT. Trong giờ làm, mình là BA/QC: trao đổi với khách hàng nước ngoài cho tới khi yêu cầu thật rõ, rồi kiểm thử sản phẩm trước khi bàn giao. Ngoài giờ, mình tự viết, phát hành và sửa dần các app bạn thấy trên trang này.'
teaser: Mình đang làm BA/QC ở WeebPal và tốt nghiệp ngành Công nghệ thông tin ở HUFLIT. Kinh nghiệm, kỹ năng và chặng đường của mình nằm ở trang riêng.
