  # ---------- Chính sách quyền riêng tư (/privacy) ----------
  - name: privacy
    label: Quyền riêng tư / Privacy
    description: 'Trang /privacy và /en/privacy. Phần "Website" và phần "Ứng dụng" (hiện dưới mục #desktop-pet, nơi EULA của app trỏ tới). Sửa nội dung thì đổi "Ngày cập nhật" ở cả hai ngôn ngữ cho giống nhau. Thu thập loại dữ liệu mới thì cập nhật trang này trước (docs/DATA-ROADMAP.md).'
    files:
      - name: privacy_site_vi
        label: Website (VI)
        file: /src/content/privacy/vi/site.md
        fields:
          - { name: locale, widget: hidden, default: vi }
          - { name: part, widget: hidden, default: site }
          - { label: Tiêu đề trang, name: title, widget: string }
          - {
              label: Mô tả cho Google (meta description),
              name: description,
              widget: text,
            }
          - { label: Đoạn mở đầu, name: lead, widget: text }
          - {
              label: 'Chữ trước ngày cập nhật',
              name: updatedLabel,
              widget: string,
            }
          - label: Ngày cập nhật
            name: updated
            widget: datetime
            type: date
            picker_utc: true
            hint: Giống nhau ở bản VI và EN; build báo lỗi nếu khác.
          - { label: Nội dung, name: body, widget: markdown }
      - name: privacy_app_vi
        label: Ứng dụng Desktop Pet (VI)
        file: /src/content/privacy/vi/app.md
        fields:
          - { name: locale, widget: hidden, default: vi }
          - { name: part, widget: hidden, default: app }
          - {
              label: Tiêu đề mục,
              name: title,
              widget: string,
              hint: 'Hiện như một mục lớn có neo #desktop-pet. Phần này phải khớp với EULA.txt trong app.',
            }
          - { label: Nội dung, name: body, widget: markdown }
      - name: privacy_site_en
        label: Website (EN)
        file: /src/content/privacy/en/site.md
        fields:
          - { name: locale, widget: hidden, default: en }
          - { name: part, widget: hidden, default: site }
          - { label: Page title, name: title, widget: string }
          - { label: Meta description, name: description, widget: text }
          - { label: Intro, name: lead, widget: text }
          - {
              label: 'Text before the date',
              name: updatedLabel,
              widget: string,
            }
          - label: Last updated
            name: updated
            widget: datetime
            type: date
            picker_utc: true
            hint: Same as the VI file; the build fails if they differ.
          - { label: Body, name: body, widget: markdown }
      - name: privacy_app_en
        label: Desktop Pet app (EN)
        file: /src/content/privacy/en/app.md
        fields:
          - { name: locale, widget: hidden, default: en }
          - { name: part, widget: hidden, default: app }
          - {
              label: Section title,
              name: title,
              widget: string,
              hint: 'Shown as a section with the #desktop-pet anchor. Must match EULA.txt in the app.',
            }
          - { label: Body, name: body, widget: markdown }

