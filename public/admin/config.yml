# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.264.0/schema/sveltia-cms.json
# ChiloLab CMS (Sveltia CMS, git-based). Hướng dẫn: docs/CMS.md
# Mỗi ngôn ngữ là một collection riêng; trường project/locale tự điền và ẩn.

backend:
  name: github
  repo: tnpt003/chilolab-portfolio
  branch: main
  # "Sign In with GitHub" goes through the site's owner sign-in (Google or
  # email code): worker/cms.ts hands back the CMS_GITHUB_TOKEN secret.
  base_url: https://chilolab.com
  auth_endpoint: api/cms/auth

logo_url: /favicon.svg
media_folder: /public/media
public_folder: /media

output:
  omit_empty_optional_fields: true
  yaml:
    quote: single

collections:
  # ---------- Pet Desktop: phiên bản ----------
  - name: pet_versions_vi
    label: Pet Desktop — Phiên bản (VI)
    label_singular: Phiên bản Pet (VI)
    folder: /src/content/versions/vi/pet-desktop
    extension: md
    format: frontmatter
    create: true
    slug: '{{version}}'
    identifier_field: version
    summary: 'v{{version}} — {{title}}'
    sortable_fields: [order, version, releasedAt]
    fields:
      - { name: project, widget: hidden, default: pet-desktop }
      - { name: locale, widget: hidden, default: vi }
      - label: Phiên bản
        name: version
        widget: string
        hint: Dạng 1.5.1. Là tên file và đường dẫn /pet-desktop/versions/<phiên bản>. Không đổi sau khi đăng.
        pattern: ['^\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$', 'Dạng x.y.z, ví dụ 1.5.1']
      - { label: Tiêu đề, name: title, widget: string }
      - { label: Tóm tắt, name: summary, widget: text }
      - label: Trạng thái sản phẩm
        name: status
        widget: select
        default: development
        options:
          - { label: Đang phát triển, value: development }
          - { label: Xem trước, value: preview }
          - { label: Đã phát hành, value: released }
        hint: Chỉ bản "Đã phát hành" được có ngày phát hành và link tải.
      - label: Thứ tự
        name: order
        widget: number
        value_type: int
        min: 0
        hint: Số lớn hơn hiện trước. Quy ước 1.5.0 → 150, 1.5.1 → 151.
      - label: Nháp (ẩn khỏi website)
        name: draft
        widget: boolean
        default: false
        required: false
      - label: Ngày phát hành
        name: releasedAt
        widget: datetime
        type: date
        picker_utc: true
        required: false
        hint: Ngày thật trên trang Release/CHANGELOG. Bỏ trống nếu chưa phát hành.
      - label: Link nguồn (release/changelog)
        name: sourceUrl
        widget: string
        required: false
        pattern: ['^https?://', 'Cần là URL http(s)']
      - label: Link tải bộ cài (Setup.exe)
        name: downloadUrl
        widget: string
        required: false
        hint: Link cố định theo phiên bản, ví dụ https://github.com/tnpt003/Pet-Computer/releases/download/v1.5.2/PetComputer-win-Setup.exe. Không dùng releases/latest.
        pattern: ['^https?://', 'Cần là URL http(s)']
      - label: Link bản Portable (.zip)
        name: portableUrl
        widget: string
        required: false
        pattern: ['^https?://', 'Cần là URL http(s)']
      - { label: Nội dung, name: body, widget: markdown }

  - name: pet_versions_en
    label: Pet Desktop — Versions (EN)
    label_singular: Pet version (EN)
    folder: /src/content/versions/en/pet-desktop
    extension: md
    format: frontmatter
    create: true
    slug: '{{version}}'
    identifier_field: version
    summary: 'v{{version}} — {{title}}'
    sortable_fields: [order, version, releasedAt]
    fields:
      - { name: project, widget: hidden, default: pet-desktop }
      - { name: locale, widget: hidden, default: en }
      - label: Version
        name: version
        widget: string
        hint: Must match the Vietnamese post, e.g. 1.5.1.
        pattern: ['^\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$', 'Use x.y.z, e.g. 1.5.1']
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Product status
        name: status
        widget: select
        default: development
        options:
          - { label: In development, value: development }
          - { label: Preview, value: preview }
          - { label: Released, value: released }
        hint: Keep status, order and release date identical to the Vietnamese post.
      - { label: Order, name: order, widget: number, value_type: int, min: 0 }
      - label: Draft (hidden from the site)
        name: draft
        widget: boolean
        default: false
        required: false
      - label: Release date
        name: releasedAt
        widget: datetime
        type: date
        picker_utc: true
        required: false
      - label: Source link (release/changelog)
        name: sourceUrl
        widget: string
        required: false
        pattern: ['^https?://', 'Must be an http(s) URL']
      - label: Installer link (Setup.exe)
        name: downloadUrl
        widget: string
        required: false
        pattern: ['^https?://', 'Must be an http(s) URL']
      - label: Portable link (.zip)
        name: portableUrl
        widget: string
        required: false
        pattern: ['^https?://', 'Must be an http(s) URL']
      - { label: Body, name: body, widget: markdown }

  # ---------- PageSpeed-Auth-Auditor: phiên bản ----------
  - name: auditor_versions_vi
    label: Auditor — Phiên bản (VI)
    label_singular: Phiên bản Auditor (VI)
    folder: /src/content/versions/vi/pagespeed-auth-auditor
    extension: md
    format: frontmatter
    create: true
    slug: '{{version}}'
    identifier_field: version
    summary: 'v{{version}} — {{title}} ({{status}})'
    fields:
      - { name: project, widget: hidden, default: pagespeed-auth-auditor }
      - { name: locale, widget: hidden, default: vi }
      - label: Phiên bản
        name: version
        widget: string
        pattern: ['^\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$', 'Dạng x.y.z']
      - { label: Tiêu đề, name: title, widget: string }
      - { label: Tóm tắt, name: summary, widget: text }
      - label: Trạng thái sản phẩm
        name: status
        widget: select
        default: development
        options:
          - { label: Đang phát triển, value: development }
          - { label: Xem trước, value: preview }
          - { label: Đã phát hành, value: released }
      - { label: Thứ tự, name: order, widget: number, value_type: int, min: 0 }
      - {
          label: Nháp,
          name: draft,
          widget: boolean,
          default: false,
          required: false,
        }
      - {
          label: Ngày phát hành,
          name: releasedAt,
          widget: datetime,
          type: date,
          picker_utc: true,
          required: false,
        }
      - {
          label: Link nguồn,
          name: sourceUrl,
          widget: string,
          required: false,
          pattern: ['^https?://', 'URL http(s)'],
        }
      - {
          label: Link tải,
          name: downloadUrl,
          widget: string,
          required: false,
          pattern: ['^https?://', 'URL http(s)'],
        }
      - { label: Nội dung, name: body, widget: markdown }

  - name: auditor_versions_en
    label: Auditor — Versions (EN)
    label_singular: Auditor version (EN)
    folder: /src/content/versions/en/pagespeed-auth-auditor
    extension: md
    format: frontmatter
    create: true
    slug: '{{version}}'
    identifier_field: version
    summary: 'v{{version}} — {{title}} ({{status}})'
    fields:
      - { name: project, widget: hidden, default: pagespeed-auth-auditor }
      - { name: locale, widget: hidden, default: en }
      - label: Version
        name: version
        widget: string
        pattern: ['^\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$', 'Use x.y.z']
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Product status
        name: status
        widget: select
        default: development
        options:
          - { label: In development, value: development }
          - { label: Preview, value: preview }
          - { label: Released, value: released }
      - { label: Order, name: order, widget: number, value_type: int, min: 0 }
      - {
          label: Draft,
          name: draft,
          widget: boolean,
          default: false,
          required: false,
        }
      - {
          label: Release date,
          name: releasedAt,
          widget: datetime,
          type: date,
          picker_utc: true,
          required: false,
        }
      - {
          label: Source link,
          name: sourceUrl,
          widget: string,
          required: false,
          pattern: ['^https?://', 'http(s) URL'],
        }
      - {
          label: Download link,
          name: downloadUrl,
          widget: string,
          required: false,
          pattern: ['^https?://', 'http(s) URL'],
        }
      - { label: Body, name: body, widget: markdown }

  # ---------- Trang dự án ----------
  - name: projects_vi
    label: Dự án (VI)
    label_singular: Dự án (VI)
    folder: /src/content/projects/vi
    extension: md
    format: frontmatter
    create: false
    slug: '{{fields.slug}}'
    media_folder: /src/assets
    public_folder: ../../../assets
    fields:
      - { name: locale, widget: hidden, default: vi }
      - { label: Tên dự án, name: title, widget: string }
      - label: Slug
        name: slug
        widget: string
        hint: Đường dẫn /<slug>. Giữ cố định và giống bản tiếng Anh.
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Chữ thường, số, dấu gạch ngang']
      - { label: Mô tả ngắn, name: description, widget: text }
      - label: Loại minh họa
        name: kind
        widget: select
        options: [pet, auditor]
      - { label: Thứ tự, name: order, widget: number, value_type: int }
      - label: Công nghệ
        name: stack
        widget: list
        required: false
        hint: Mỗi dòng một công nghệ thật sự dùng trong dự án. Giữ giống bản tiếng Anh.
      - {
          label: Nháp,
          name: draft,
          widget: boolean,
          default: false,
          required: false,
        }
      - label: Ảnh xem trước
        name: preview
        widget: object
        required: false
        fields:
          - { label: Ảnh, name: image, widget: image }
          - { label: Mô tả ảnh (alt), name: alt, widget: string }
          - { label: Chú thích, name: caption, widget: string, required: false }
      - label: Video (/media/ten-video.mp4)
        name: video
        widget: string
        required: false
        pattern: ['^/media/[a-z0-9-]+\.mp4$', 'Dạng /media/ten-video.mp4']
      - label: Chú thích video
        name: videoCaption
        widget: string
        required: false
        hint: Độ dài, có âm thanh hay không, quay từ bản nào.
      - label: Thư viện ảnh
        name: gallery
        widget: list
        required: false
        hint: Ảnh chụp ứng dụng thật, hiện thành lưới dưới video.
        fields:
          - { label: Ảnh, name: image, widget: image }
          - { label: Mô tả ảnh (alt), name: alt, widget: string }
      - { label: Link dùng thử, name: demoUrl, widget: string, required: false }
      - { label: Link mã nguồn, name: repoUrl, widget: string, required: false }
      - label: Link tải (dự phòng)
        name: downloadUrl
        widget: string
        required: false
        hint: Nút tải trên trang dự án lấy từ phiên bản đã phát hành mới nhất; chỉ cần trường này khi dự án không có bài phiên bản.
      - label: Phiên bản hiển thị ở khối Tải xuống
        name: featuredVersion
        widget: string
        required: false
        pattern: ['^\d+\.\d+\.\d+(-[a-z0-9.-]+)?$', 'Dạng 1.5.0']
        hint: Bỏ trống để tự lấy bản đã phát hành mới nhất. Phải là phiên bản đã phát hành và có link tải. Đặt giống nhau ở bản VI và EN.
      - label: Lưu ý dưới nút Tải
        name: downloadNote
        widget: string
        required: false
        hint: Một câu ngắn, ví dụ cách vượt cảnh báo SmartScreen.
      - label: Các bước cài đặt
        name: install
        widget: list
        required: false
        hint: Hiện thành thẻ có icon. Dùng **chữ đậm** cho tên nút, `chữ code` cho tên file.
        fields:
          - label: Icon
            name: icon
            widget: select
            options:
              [
                download,
                archive,
                shield,
                cat,
                folder,
                sparkle,
                history,
                message,
                user,
                login,
                image,
              ]
          - { label: Tiêu đề, name: title, widget: string }
          - { label: Nội dung, name: text, widget: text }
      - { label: Nội dung, name: body, widget: markdown }

  - name: projects_en
    label: Projects (EN)
    label_singular: Project (EN)
    folder: /src/content/projects/en
    extension: md
    format: frontmatter
    create: false
    slug: '{{fields.slug}}'
    media_folder: /src/assets
    public_folder: ../../../assets
    fields:
      - { name: locale, widget: hidden, default: en }
      - { label: Title, name: title, widget: string }
      - label: Slug
        name: slug
        widget: string
        hint: Must match the Vietnamese project.
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Lowercase letters, digits, hyphens']
      - { label: Description, name: description, widget: text }
      - {
          label: Illustration kind,
          name: kind,
          widget: select,
          options: [pet, auditor],
        }
      - { label: Order, name: order, widget: number, value_type: int }
      - label: Stack
        name: stack
        widget: list
        required: false
        hint: One technology per line, actually used in the project. Keep it identical to the Vietnamese page.
      - {
          label: Draft,
          name: draft,
          widget: boolean,
          default: false,
          required: false,
        }
      - label: Preview image
        name: preview
        widget: object
        required: false
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Alt text, name: alt, widget: string }
          - { label: Caption, name: caption, widget: string, required: false }
      - label: Video (/media/name.mp4)
        name: video
        widget: string
        required: false
        pattern: ['^/media/[a-z0-9-]+\.mp4$', 'Use /media/name.mp4']
      - label: Video caption
        name: videoCaption
        widget: string
        required: false
        hint: Length, whether it has sound, which build it shows.
      - label: Gallery
        name: gallery
        widget: list
        required: false
        hint: Real app captures, shown as a grid under the video.
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Alt text, name: alt, widget: string }
      - { label: Demo link, name: demoUrl, widget: string, required: false }
      - {
          label: Repository link,
          name: repoUrl,
          widget: string,
          required: false,
        }
      - {
          label: Download link (fallback),
          name: downloadUrl,
          widget: string,
          required: false,
        }
      - label: Version shown in the Download panel
        name: featuredVersion
        widget: string
        required: false
        pattern: ['^\d+\.\d+\.\d+(-[a-z0-9.-]+)?$', 'Format 1.5.0']
        hint: Empty = newest release with a download. Keep it identical to the Vietnamese entry.
      - label: Note under the Download button
        name: downloadNote
        widget: string
        required: false
        hint: One short sentence, for example how to get past SmartScreen.
      - label: Install steps
        name: install
        widget: list
        required: false
        hint: Shown as icon cards. Use **bold** for button names and `code` for file names.
        fields:
          - label: Icon
            name: icon
            widget: select
            options:
              [
                download,
                archive,
                shield,
                cat,
                folder,
                sparkle,
                history,
                message,
                user,
                login,
                image,
              ]
          - { label: Title, name: title, widget: string }
          - { label: Text, name: text, widget: text }
      - { label: Body, name: body, widget: markdown }

  # ---------- Trang Về mình (About) ----------
  - name: profile
    label: Về mình / About
    files:
      - name: profile_vi
        label: Về mình (VI)
        file: /src/content/profile/vi.yml
        fields:
          - { name: locale, widget: hidden, default: vi }
          - {
              label: 'Tiêu đề trang (tab, menu)',
              name: pageTitle,
              widget: string,
            }
          - {
              label: Mô tả cho Google (meta description),
              name: metaDescription,
              widget: text,
            }
          - { label: Lời chào (tiêu đề lớn), name: heading, widget: text }
          - { label: Đoạn giới thiệu, name: lead, widget: text }
          - { label: Đoạn ngắn ở trang chủ, name: teaser, widget: text }
          - {
              label: Nút "tìm hiểu thêm" ở trang chủ,
              name: readMore,
              widget: string,
            }
          - label: Ý chính (dưới lời chào)
            name: facts
            widget: list
            fields:
              - {
                  label: Biểu tượng,
                  name: icon,
                  widget: select,
                  options:
                    [
                      briefcase,
                      graduation,
                      testing,
                      code,
                      phone,
                      database,
                      braces,
                      terminal,
                      chip,
                      globe,
                      award,
                      download,
                      archive,
                      history,
                      message,
                      shield,
                      user,
                      folder,
                      sparkle,
                      branch,
                      cat,
                      image,
                      mail,
                      login,
                      network,
                    ],
                }
              - { label: Nội dung, name: text, widget: string }
          - { label: Nút gửi email, name: emailMe, widget: string }
          - { label: Nút xem dự án, name: seeProjects, widget: string }
          - { label: Nút GitHub, name: github, widget: string }
          - { label: Mô tả ảnh Pet (alt), name: petAlt, widget: text }
          - label: Ảnh chân dung
            name: portrait
            widget: image
            media_folder: /src/assets
            public_folder: ../../assets
            hint: 'Ảnh ở trang chủ và trang Về mình. Mô tả ảnh nằm ở Chữ giao diện → Mô tả ảnh chân dung.'
          - {
              label: Tiêu đề mục Kinh nghiệm,
              name: experienceTitle,
              widget: string,
            }
          - { label: Vị trí, name: role, widget: string }
          - label: Công ty
            name: company
            widget: string
            hint: Chỉ tên công ty của bạn. Không ghi tên khách hàng (NDA).
          - { label: Thời gian làm, name: jobPeriod, widget: string }
          - { label: Nhãn "Hiện tại", name: current, widget: string }
          - label: Công việc
            name: duties
            widget: list
            required: false
            hint: Mỗi dòng một việc. Mô tả khách hàng theo loại, không nêu tên.
          - { label: Tiêu đề mục Học vấn, name: educationTitle, widget: string }
          - { label: Học vấn, name: education, widget: text }
          - {
              label: Thời gian / tốt nghiệp,
              name: educationPeriod,
              widget: string,
            }
          - { label: Tiêu đề mục Cách làm việc, name: howTitle, widget: string }
          - {
              label: Giới thiệu mục Cách làm việc,
              name: howIntro,
              widget: text,
            }
          - label: Các bước làm việc
            name: steps
            widget: list
            required: false
            fields:
              - {
                  label: Biểu tượng,
                  name: icon,
                  widget: select,
                  options:
                    [
                      briefcase,
                      graduation,
                      testing,
                      code,
                      phone,
                      database,
                      braces,
                      terminal,
                      chip,
                      globe,
                      award,
                      download,
                      archive,
                      history,
                      message,
                      shield,
                      user,
                      folder,
                      sparkle,
                      branch,
                      cat,
                      image,
                      mail,
                      login,
                      network,
                    ],
                }
              - { label: Tiêu đề, name: title, widget: string }
              - { label: Nội dung, name: text, widget: text }
          - { label: Tiêu đề mục Kỹ năng, name: skillsTitle, widget: string }
          - { label: Giới thiệu mục Kỹ năng, name: skillsIntro, widget: text }
          - label: Nhóm kỹ năng
            name: skills
            widget: list
            required: false
            hint: Trang chủ hiện 3 mục đầu của mỗi nhóm.
            fields:
              - {
                  label: Biểu tượng,
                  name: icon,
                  widget: select,
                  options:
                    [
                      briefcase,
                      graduation,
                      testing,
                      code,
                      phone,
                      database,
                      braces,
                      terminal,
                      chip,
                      globe,
                      award,
                      download,
                      archive,
                      history,
                      message,
                      shield,
                      user,
                      folder,
                      sparkle,
                      branch,
                      cat,
                      image,
                      mail,
                      login,
                      network,
                    ],
                }
              - { label: Tên nhóm, name: name, widget: string }
              - { label: Các kỹ năng, name: items, widget: list }
          - {
              label: Tiêu đề mục Hành trình,
              name: journeyTitle,
              widget: string,
            }
          - label: Nhãn loại mốc
            name: journeyKinds
            widget: object
            fields:
              - { label: Học, name: study, widget: string }
              - { label: Công việc, name: work, widget: string }
              - { label: Phát hành, name: release, widget: string }
          - label: Mốc hành trình
            name: journey
            widget: list
            required: false
            hint: Mốc phát hành Pet Desktop tự lấy từ ghi chú phiên bản, không cần thêm ở đây. Giữ năm và ngày giống bản kia.
            fields:
              - {
                  label: Loại,
                  name: kind,
                  widget: select,
                  options: [study, work],
                }
              - { label: Năm, name: year, widget: number, value_type: int }
              - label: Tháng (YYYY-MM) hoặc ngày (YYYY-MM-DD)
                name: date
                widget: string
                required: false
                pattern: ['^d{4}-d{2}(-d{2})?$', 'Dạng 2025-08 hoặc 2025-08-15']
              - {
                  label: Nhãn thời gian hiển thị,
                  name: label,
                  widget: string,
                  required: false,
                }
              - { label: Tiêu đề, name: title, widget: string }
              - { label: Nội dung, name: text, widget: text, required: false }
          - label: Mẫu tiêu đề mốc phát hành
            name: releaseTitle
            widget: string
